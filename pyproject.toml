[tool.poetry]
name = "scanner-densitometer"
version = "0.1.0"
description = "Tkinter app for using scanner TIFF files as a densitometer workflow for Stouffer T2115 step-wedge prints"
authors = []
readme = "README.md"
packages = [{ include = "densitometer" }]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26.4"
pillow = "^10.4.0"
matplotlib = "^3.8.4"

[tool.poetry.group.dev.dependencies]

[tool.poetry.scripts]
densitometer = "densitometer.app:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
